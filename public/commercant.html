<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vue commerçant — Boutique Démo</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="wrap">
    <h1>Vue commerçant</h1>
    <p class="lead">Tableau de bord interne : commandes, remboursements et impact financier.</p>

    <!-- Barre de mode : le levier avant/après pour la démo -->
    <div class="mode-bar" id="modebar">
      <span class="dot"></span>
      <div>
        <div style="font-weight:700" id="mode-titre"></div>
        <div class="muted" style="font-size:13px" id="mode-sous"></div>
      </div>
      <label class="switch row"><input type="checkbox" id="mode-check"> <span style="font-weight:700">Mode sécurisé (corrigé)</span></label>
    </div>

    <div class="row" style="gap:16px; margin-bottom:20px; flex-wrap:wrap">
      <div class="card" style="flex:1; min-width:220px">
        <div class="muted">Perte sèche (remboursé sans retour)</div>
        <div class="big-number" id="perte" style="color:var(--danger)">—</div>
        <div class="muted" id="perte-detail"></div>
      </div>
      <div class="card" style="flex:1; min-width:220px">
        <div class="muted">Demandes en attente de retour</div>
        <div class="big-number" id="attente">—</div>
        <div class="muted">traitées manuellement avant tout remboursement</div>
      </div>
    </div>

    <div id="tableau"></div>

    <div class="row" style="margin-top:18px">
      <button class="btn ghost sm" id="reset">↺ Réinitialiser la démo</button>
    </div>
  </main>

  <script src="/assets/app.js"></script>
  <script>
    (async () => { await monterEntete('commercant'); charger(); })();

    document.getElementById('mode-check').addEventListener('change', async (e) => {
      await api.post('/api/mode', { securise: e.target.checked });
      charger();
    });
    document.getElementById('reset').addEventListener('click', async () => {
      await api.post('/api/reset'); charger();
    });

    async function charger() {
      const d = await api.get('/api/merchant/summary');

      // Barre de mode
      const bar = document.getElementById('modebar');
      document.getElementById('mode-check').checked = d.modeSecurise;
      bar.className = 'mode-bar ' + (d.modeSecurise ? 'secure' : 'vuln');
      bar.querySelector('.dot').style.background = d.modeSecurise ? 'var(--ok)' : 'var(--danger)';
      document.getElementById('mode-titre').textContent = d.modeSecurise ? 'Mode sécurisé — failles corrigées' : 'Mode vulnérable — failles actives';
      document.getElementById('mode-sous').textContent = d.modeSecurise
        ? 'Contrôle d’accès rétabli + remboursement conditionné au retour.'
        : 'Accès aux commandes d’autrui possible + remboursement auto sans retour.';

      // Chiffres
      document.getElementById('perte').textContent = euros(d.perteTotale);
      document.getElementById('perte-detail').textContent = d.nbFraudes
        ? `${d.nbFraudes} commande(s) : #${d.idsFraudes.join(', #')}` : 'aucune fraude constatée';
      document.getElementById('attente').textContent = d.nbEnAttente;

      // Tableau des commandes
      document.getElementById('tableau').innerHTML = `
        <table>
          <thead><tr><th>N°</th><th>Client</th><th>Date</th><th>Statut</th><th>Remboursement</th><th>Marchandise</th><th>Montant</th></tr></thead>
          <tbody>
            ${d.commandes.map((c) => `<tr>
              <td><b>#${c.id}</b></td><td>${c.client}</td><td>${c.date}</td>
              <td>${pillStatut(c.statut)}</td><td>${pillStatut(c.remboursement)}</td>
              <td>${c.remboursement === 'remboursée' ? (c.marchandiseRetournee ? 'retournée' : '<b style="color:var(--danger)">non retournée</b>') : '—'}</td>
              <td>${euros(c.total)}</td></tr>`).join('')}
          </tbody>
        </table>`;
    }
  </script>
</body>
</html>
